name: Build Unsigned IPA

on:
  workflow_dispatch: # This allows you to manually trigger the build

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Ensures any linked Rust crates/submodules are pulled

      - name: Install Rust (for open_oura integration)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Dependencies
        run: |
          # If the project relies on CocoaPods, this will install them
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build Unsigned App
        run: |
          # Note: If the project doesn't use a workspace, change '-workspace open_health.xcworkspace' 
          # to '-project open_health.xcodeproj'
          
          xcodebuild clean build \
            -workspace open_health.xcworkspace \
            -scheme open_health \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build

      - name: Package into IPA
        run: |
          cd ${{ github.workspace }}
          mkdir Payload
          # Copies the compiled app into the Payload folder
          cp -R build/*.app Payload/
          # Zips it into the standard .ipa format
          zip -qr open_health.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_health_unsigned
          path: open_health.ipa
          retention-days: 7
