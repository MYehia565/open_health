name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build Rust iOS framework
        run: bash apps/ios/build-xcframework.sh

      - name: Generate Xcode project
        working-directory: apps/ios/OuraApp
        run: xcodegen generate --spec project-ci.yml

      - name: Build unsigned iOS app
        working-directory: apps/ios/OuraApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project OuraApp.xcodeproj \
            -scheme OuraApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/OuraApp.app"
          test -d "$APP_PATH" || {
            echo "::error::Built app not found at $APP_PATH"
            find "${{ runner.temp }}/DerivedData/Build/Products" -maxdepth 3 -print || true
            exit 1
          }
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry open_health-unsigned.ipa Payload
          test -s open_health-unsigned.ipa
          unzip -l open_health-unsigned.ipa | head -40
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: open_health-unsigned-ipa
          path: open_health-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
